name: npm Publish (manual)

# Publishes the `@garygentry/rauf` npm launcher (npm-dist/) to npm via npm Trusted Publishing
# (OIDC) — no token, no secret. Manual-only, outside the PR gate. Requires a
# Trusted Publisher configured on the npm package pointing at this repo + this
# workflow filename, and publishing-access set to "require 2FA, disallow tokens".
#
# The launcher is a zero-dependency shim (npm-dist/rauf.mjs); there is no build
# step. The published version is npm-dist/package.json's `version` at the checked-
# out ref — kept in lockstep with the binary release by the version guards, so
# `npx rauf@X.Y.Z` resolves to the vX.Y.Z GitHub-release binary.

on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: "npm dist-tag to publish under"
        required: false
        default: "latest"

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm-dist
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          # Node 24 bundles npm >= 11.6 (Trusted Publishing/OIDC needs >= 11.5.1),
          # so we can use the bundled npm directly. Do NOT self-upgrade the global
          # npm in place (`npm i -g npm@latest`): that upgrade prunes npm's bundled
          # `sigstore` dependency, breaking `npm publish --provenance` with
          # "Cannot find module 'sigstore'" (observed on the v0.12.0 publish).
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      # OIDC: no token env — npm detects the trusted-publisher OIDC context in Actions.
      - run: npm publish --access public --provenance --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
