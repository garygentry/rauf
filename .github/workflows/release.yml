name: Release

# The ONLY workflow that publishes (ADR 0046 A4, #166). npm Trusted Publishing trusts it
# by filename + environment, so do not rename it. Two jobs:
#   verify  — no publish credentials: gate, build, smoke, summary for the approver.
#   publish — `environment: release` (one human approval): attest, GitHub Release, npm.
# The tag push is the only automatic trigger, so the binaries and the npm launcher always
# ship together from the same tag.

on:
  push:
    tags: ["v*"] # REQ-TRIGGER-01
  # REQ-TRIGGER-03 (P2) — re-release an existing tag; same gate. Run it with "Use workflow
  # from" set to that TAG (not main): the `release` environment only deploys `v*` refs and
  # checks the run's own ref, so a run dispatched from a branch can never reach `publish`.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)release"
        required: true

permissions:
  contents: read # per-job grants below; only `publish` can write or mint an OIDC token

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }} # serialize same-tag runs (push + dispatch share a group) (cross-tag safety: tech-spec §3.7)
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.preflight.outputs.version }}
      is_prerelease: ${{ steps.preflight.outputs.is_prerelease }}
      tag: ${{ steps.preflight.outputs.tag }}
    steps:
      # 1. Full history + tags for the Full Changelog compare link (REQ-NOTES-03).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      # 1b. A dispatch must run from the tag it re-releases (see the trigger comment);
      #     fail here rather than after the approver has been paged.
      - name: Require dispatch from the tag ref
        if: github.event_name == 'workflow_dispatch' && github.ref != format('refs/tags/{0}', github.event.inputs.tag)
        run: |
          echo "::error::dispatch from the tag: Run workflow → Use workflow from → tag ${{ github.event.inputs.tag }} (got ${{ github.ref }}); the release environment only deploys v* refs" >&2
          exit 1

      # 2. Actor authorization (defense-in-depth — REQ-SEC-02; primary layer is the
      #    tag ruleset, see 06-security-and-setup.md).
      - name: Authorize actor
        if: github.actor != github.repository_owner
        run: |
          echo "::error::actor ${{ github.actor }} is not the repository owner" >&2
          exit 1

      # 3. Toolchain — setup-bun auto-reads .bun-version.
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v6

      # 4. Dependencies.
      - run: pnpm install --frozen-lockfile

      # 5. Preflight: drift guard + classification + "no existing release" check.
      - name: Preflight
        id: preflight
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: bun run scripts/release/preflight.ts
      - name: Assert no existing release (REQ-RELIABILITY-02)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists — refusing to overwrite" >&2
            exit 1
          fi
      - name: Assert version not on npm
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          if [ -n "$(npm view "@garygentry/rauf@$VERSION" version 2>/dev/null)" ]; then
            echo "::error::@garygentry/rauf@$VERSION is already on npm — refusing to release" >&2
            exit 1
          fi

      # 6. Quality gate (REQ-BUILD-06) — the SAME composite action ci.yml uses.
      - uses: ./.github/actions/quality-gate

      # 7. Cross-compile all five targets (REQ-BUILD-01/02/07). pnpm build already
      #    ran in step 6, so this is just the five compile invocations into dist/.
      - name: Cross-compile binaries
        # x64 targets use Bun's -baseline runtime so the binaries run on every x64
        # CPU (no AVX2 requirement); plain x64 builds SIGILL on non-AVX2 hosts. The
        # --outfile asset names are independent of --target, so they're unchanged.
        # arm64 has no AVX2 concept. Keep these triples in sync with RELEASE_TARGETS
        # in scripts/release/lib.ts (lib.test.ts guards the baseline invariant).
        # --define RAUF_BUILD_CHANNEL stamps these as release binaries so
        # `rauf version --json` reports channel=release-binary (the local `pnpm
        # compile` uses "compiled-local"); see packages/cli/src/runtime-channel.ts.
        run: |
          mkdir -p dist
          bun build --compile --define RAUF_BUILD_CHANNEL='"release-binary"' --target=bun-linux-x64-baseline   scripts/binary-entry.ts --outfile dist/rauf-linux-x64
          bun build --compile --define RAUF_BUILD_CHANNEL='"release-binary"' --target=bun-linux-arm64          scripts/binary-entry.ts --outfile dist/rauf-linux-arm64
          bun build --compile --define RAUF_BUILD_CHANNEL='"release-binary"' --target=bun-darwin-x64-baseline  scripts/binary-entry.ts --outfile dist/rauf-darwin-x64
          bun build --compile --define RAUF_BUILD_CHANNEL='"release-binary"' --target=bun-darwin-arm64          scripts/binary-entry.ts --outfile dist/rauf-darwin-arm64
          bun build --compile --define RAUF_BUILD_CHANNEL='"release-binary"' --target=bun-windows-x64-baseline scripts/binary-entry.ts --outfile dist/rauf-windows-x64.exe

      # 7b. Smoke-test the linux-x64 binary on the runner BEFORE publishing, so a
      #     broken or wrong-version binary blocks the release. The ubuntu runner has
      #     AVX2, so the -baseline binary runs fine here (baseline runs everywhere).
      #     This catches "binary broken / wrong version"; the no-AVX2 regression case
      #     is locked by the RELEASE_TARGETS baseline unit test (can't be exercised on
      #     an AVX2 runner). Only linux-x64 is runnable in CI (darwin/windows can't be).
      - name: Smoke-test linux-x64 binary
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          chmod +x dist/rauf-linux-x64
          got="$(dist/rauf-linux-x64 version --json)"; echo "$got"
          echo "$got" | grep -q "\"version\": \"$VERSION\"" \
            || { echo "::error::linux-x64 binary failed to run or version mismatch (wanted $VERSION)"; exit 1; }

      # 8. Checksums (REQ-INTEGRITY-01) — plain filenames so `sha256sum -c` works post-download.
      - name: Checksums
        run: cd dist && sha256sum rauf-* > SHA256SUMS

      # 9. Release notes (REQ-NOTES-02/03).
      - name: Build notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          VERSION: ${{ steps.preflight.outputs.version }}
        run: bun run scripts/release/build-notes.ts # writes dist/NOTES.md

      # 10. Release summary for the approver (ADR 0046 A4): what the one approval ships.
      - name: Release summary
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          VERSION: ${{ steps.preflight.outputs.version }}
          IS_PRERELEASE: ${{ steps.preflight.outputs.is_prerelease }}
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"
          {
            echo "## Release $TAG — awaiting approval"
            echo ""
            echo "- **Version:** \`$VERSION\` (prerelease: $IS_PRERELEASE)"
            echo "- **Ships:** GitHub Release \`$TAG\` (5 binaries + SHA256SUMS, attested) and npm \`@garygentry/rauf@$VERSION\` (dist-tag \`$( [ "$IS_PRERELEASE" = "true" ] && echo next || echo latest )\`)"
            echo "- **Previous tag:** ${prev:-none}"
            echo ""
            if [ -n "$prev" ] && [ -n "$(git diff --name-only "$prev" "$TAG" -- .github/)" ]; then
              echo "> [!CAUTION]"
              echo "> **\`.github/\` CHANGED since $prev** — review the workflow diff before approving:"
              echo ">"
              git diff --stat "$prev" "$TAG" -- .github/ | sed 's/^/> /'
              echo ""
            fi
            echo "### Changelog"
            echo ""
            cat dist/NOTES.md
            echo ""
            if [ -n "$prev" ]; then
              echo "### \`git diff --stat $prev..$TAG\`"
              echo ""
              echo '```'
              git diff --stat "$prev" "$TAG"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 11. Hand the exact verified bytes to the publish job.
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/rauf-*
            dist/SHA256SUMS
            dist/NOTES.md
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release # one human approval; deployments limited to v* tags
    permissions:
      contents: write # gh release create
      id-token: write # npm provenance + attestation signing (OIDC)
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      # 12. Build provenance for the binaries + checksum file.
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/rauf-*
            dist/SHA256SUMS

      # 13. Atomic single-shot GitHub Release (REQ-RELIABILITY-01, REQ-BUILD-03/04/05).
      #     Before npm: the launcher downloads this release's binary on first run.
      #     Skips only if a release already exists for the tag — i.e. a "re-run failed
      #     jobs" after an npm failure (verify refused an existing release up front).
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          IS_PRERELEASE: ${{ needs.verify.outputs.is_prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::release $TAG already exists (job re-run) — not recreating"
            exit 0
          fi
          gh release create "$TAG" \
            dist/rauf-linux-x64 dist/rauf-linux-arm64 \
            dist/rauf-darwin-x64 dist/rauf-darwin-arm64 \
            dist/rauf-windows-x64.exe dist/SHA256SUMS \
            --title "$TAG" --notes-file dist/NOTES.md --verify-tag \
            $( [ "$IS_PRERELEASE" = "true" ] && echo --prerelease || echo --latest )

      # 14. npm launcher via Trusted Publishing (OIDC) — no token, anywhere.
      - uses: actions/setup-node@v6
        with:
          # Node 24 bundles npm >= 11.6 (Trusted Publishing/OIDC needs >= 11.5.1),
          # so we can use the bundled npm directly. Do NOT self-upgrade the global
          # npm in place (`npm i -g npm@latest`): that upgrade prunes npm's bundled
          # `sigstore` dependency, breaking `npm publish --provenance` with
          # "Cannot find module 'sigstore'" (observed on the v0.12.0 publish).
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Publish npm launcher
        working-directory: npm-dist
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.is_prerelease == 'true' && 'next' || 'latest' }}
        run: |
          if [ -n "$(npm view "@garygentry/rauf@$VERSION" version 2>/dev/null)" ]; then
            echo "::warning::@garygentry/rauf@$VERSION already on npm (job re-run) — not republishing"
            exit 0
          fi
          npm publish --access public --provenance --tag "$DIST_TAG"

      - name: Summary
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          echo "### Released $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/@garygentry/rauf/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"
