<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">

    <style>
      /* Dark mode (default — matches Starlight's default) */
      :root {
        --bg: hsl(224, 10%, 10%);
        --container-fill: hsl(224, 14%, 14%);
        --container-stroke: hsl(224, 10%, 25%);
        --primary-fill: hsl(217, 50%, 18%);
        --primary-stroke: #3b82f6;
        --secondary-fill: hsl(224, 14%, 16%);
        --secondary-stroke: hsl(224, 6%, 40%);
        --nested-fill: hsl(217, 50%, 14%);
        --nested-stroke: hsl(217, 40%, 30%);
        --info-fill: hsl(217, 50%, 18%);
        --info-stroke: #3b82f6;
        --success-fill: hsl(145, 38%, 16%);
        --success-stroke: #22c55e;
        --warning-fill: hsl(38, 48%, 18%);
        --warning-stroke: #f59e0b;
        --danger-fill: hsl(0, 45%, 18%);
        --danger-stroke: #ef4444;
        --neutral-fill: hsl(224, 14%, 16%);
        --neutral-stroke: hsl(224, 6%, 42%);
        --text: hsl(224, 6%, 82%);
        --text-muted: hsl(224, 6%, 56%);
        --arrow: hsl(224, 6%, 50%);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --container-fill: hsl(224, 20%, 97%);
          --container-stroke: hsl(224, 6%, 82%);
          --primary-fill: #dbeafe;
          --primary-stroke: #2563eb;
          --secondary-fill: hsl(224, 20%, 96%);
          --secondary-stroke: hsl(224, 7%, 60%);
          --nested-fill: hsl(217, 60%, 94%);
          --nested-stroke: hsl(217, 40%, 70%);
          --info-fill: #dbeafe;
          --info-stroke: #2563eb;
          --success-fill: #dcfce7;
          --success-stroke: #16a34a;
          --warning-fill: #fef3c7;
          --warning-stroke: #d97706;
          --danger-fill: #fee2e2;
          --danger-stroke: #dc2626;
          --neutral-fill: hsl(224, 20%, 96%);
          --neutral-stroke: hsl(224, 7%, 60%);
          --text: hsl(224, 10%, 20%);
          --text-muted: hsl(224, 7%, 40%);
          --arrow: hsl(224, 7%, 45%);
        }
      }

      .box-container { fill: var(--container-fill); stroke: var(--container-stroke); }
      .box-primary { fill: var(--primary-fill); stroke: var(--primary-stroke); }
      .box-secondary { fill: var(--secondary-fill); stroke: var(--secondary-stroke); }
      .box-nested { fill: var(--nested-fill); stroke: var(--nested-stroke); }
      .box-info { fill: var(--info-fill); stroke: var(--info-stroke); }
      .box-success { fill: var(--success-fill); stroke: var(--success-stroke); }
      .box-warning { fill: var(--warning-fill); stroke: var(--warning-stroke); }
      .box-danger { fill: var(--danger-fill); stroke: var(--danger-stroke); }
      .box-neutral { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
      .label { fill: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .sublabel { fill: var(--text-muted); font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .arrow-line { stroke: var(--arrow); fill: none; stroke-width: 1.5; }
      .arrow-line-dashed { stroke: var(--arrow); fill: none; stroke-width: 1.5; stroke-dasharray: 6,4; }
      .arrow-head { fill: var(--arrow); }
      .arrow-label { fill: var(--text-muted); font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 11px; }
    </style>
  <rect width="760" height="400" fill="var(--bg)" rx="4" />
  <rect class="box-primary" x="90" y="60" width="180" height="60" rx="8" stroke-width="1" />
  <text class="label" x="180" y="86" font-size="14" font-weight="600" text-anchor="middle">packages/cli</text>
  <text class="sublabel" x="180" y="102" font-size="11" text-anchor="middle">commands · CLI binary</text>
  <rect class="box-primary" x="490" y="60" width="180" height="60" rx="8" stroke-width="1" />
  <text class="label" x="580" y="86" font-size="14" font-weight="600" text-anchor="middle">packages/web</text>
  <text class="sublabel" x="580" y="102" font-size="11" text-anchor="middle">Hono API + React SPA</text>
  <rect class="box-primary" x="270" y="190" width="220" height="60" rx="8" stroke-width="1" />
  <text class="label" x="380" y="216" font-size="14" font-weight="600" text-anchor="middle">packages/loop</text>
  <text class="sublabel" x="380" y="232" font-size="11" text-anchor="middle">LoopRunner · events · signal parser</text>
  <rect class="box-secondary" x="250" y="310" width="260" height="60" rx="8" stroke-width="1" />
  <text class="label" x="380" y="336" font-size="14" font-weight="600" text-anchor="middle">packages/core</text>
  <text class="sublabel" x="380" y="352" font-size="11" text-anchor="middle">discovery · installer · backlog · status · config</text>
  <polygon class="arrow-head" points="330,190 323.2,188.3 326.7,183.8" />
  <polyline class="arrow-line" points="240,120 324.5,185.7" />
  <text class="arrow-label" x="279" y="155" text-anchor="end">imports</text>
  <polygon class="arrow-head" points="430,190 433.3,183.8 436.8,188.3" />
  <polyline class="arrow-line" points="520,120 435.5,185.7" />
  <text class="arrow-label" x="481" y="155" text-anchor="start">imports</text>
  <polygon class="arrow-head" points="380,310 377.1,303.6 382.9,303.6" />
  <polyline class="arrow-line" points="380,250 380,303" />
  <text class="arrow-label" x="388" y="280" text-anchor="start">imports</text>
  <polygon class="arrow-head" points="250,340 243.6,342.9 243.6,337.1" />
  <polyline class="arrow-line-dashed" points="130,120 130,340 243,340" />
  <text class="arrow-label" x="190" y="334" text-anchor="middle">+ core</text>
  <polygon class="arrow-head" points="510,340 516.4,337.1 516.4,342.9" />
  <polyline class="arrow-line-dashed" points="630,120 630,340 517,340" />
  <text class="arrow-label" x="570" y="334" text-anchor="middle">+ core</text>
</svg>
