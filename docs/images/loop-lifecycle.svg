<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">

    <style>
      /* Dark mode (default — matches Starlight's default) */
      :root {
        --bg: hsl(224, 10%, 10%);
        --container-fill: hsl(224, 14%, 14%);
        --container-stroke: hsl(224, 10%, 25%);
        --primary-fill: hsl(217, 50%, 18%);
        --primary-stroke: #3b82f6;
        --secondary-fill: hsl(224, 14%, 16%);
        --secondary-stroke: hsl(224, 6%, 40%);
        --nested-fill: hsl(217, 50%, 14%);
        --nested-stroke: hsl(217, 40%, 30%);
        --info-fill: hsl(217, 50%, 18%);
        --info-stroke: #3b82f6;
        --success-fill: hsl(145, 38%, 16%);
        --success-stroke: #22c55e;
        --warning-fill: hsl(38, 48%, 18%);
        --warning-stroke: #f59e0b;
        --danger-fill: hsl(0, 45%, 18%);
        --danger-stroke: #ef4444;
        --neutral-fill: hsl(224, 14%, 16%);
        --neutral-stroke: hsl(224, 6%, 42%);
        --text: hsl(224, 6%, 82%);
        --text-muted: hsl(224, 6%, 56%);
        --arrow: hsl(224, 6%, 50%);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --container-fill: hsl(224, 20%, 97%);
          --container-stroke: hsl(224, 6%, 82%);
          --primary-fill: #dbeafe;
          --primary-stroke: #2563eb;
          --secondary-fill: hsl(224, 20%, 96%);
          --secondary-stroke: hsl(224, 7%, 60%);
          --nested-fill: hsl(217, 60%, 94%);
          --nested-stroke: hsl(217, 40%, 70%);
          --info-fill: #dbeafe;
          --info-stroke: #2563eb;
          --success-fill: #dcfce7;
          --success-stroke: #16a34a;
          --warning-fill: #fef3c7;
          --warning-stroke: #d97706;
          --danger-fill: #fee2e2;
          --danger-stroke: #dc2626;
          --neutral-fill: hsl(224, 20%, 96%);
          --neutral-stroke: hsl(224, 7%, 60%);
          --text: hsl(224, 10%, 20%);
          --text-muted: hsl(224, 7%, 40%);
          --arrow: hsl(224, 7%, 45%);
        }
      }

      .box-container { fill: var(--container-fill); stroke: var(--container-stroke); }
      .box-primary { fill: var(--primary-fill); stroke: var(--primary-stroke); }
      .box-secondary { fill: var(--secondary-fill); stroke: var(--secondary-stroke); }
      .box-nested { fill: var(--nested-fill); stroke: var(--nested-stroke); }
      .box-info { fill: var(--info-fill); stroke: var(--info-stroke); }
      .box-success { fill: var(--success-fill); stroke: var(--success-stroke); }
      .box-warning { fill: var(--warning-fill); stroke: var(--warning-stroke); }
      .box-danger { fill: var(--danger-fill); stroke: var(--danger-stroke); }
      .box-neutral { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
      .label { fill: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .sublabel { fill: var(--text-muted); font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .arrow-line { stroke: var(--arrow); fill: none; stroke-width: 1.5; }
      .arrow-line-dashed { stroke: var(--arrow); fill: none; stroke-width: 1.5; stroke-dasharray: 6,4; }
      .arrow-head { fill: var(--arrow); }
      .arrow-label { fill: var(--text-muted); font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 11px; }
    </style>
  <rect width="760" height="360" fill="var(--bg)" rx="4" />
  <rect class="box-primary" x="40" y="40" width="160" height="58" rx="8" stroke-width="1" />
  <text class="label" x="120" y="65" font-size="14" font-weight="600" text-anchor="middle">Select item</text>
  <text class="sublabel" x="120" y="81" font-size="11" text-anchor="middle">next pending → in_progress</text>
  <rect class="box-primary" x="300" y="40" width="160" height="58" rx="8" stroke-width="1" />
  <text class="label" x="380" y="65" font-size="14" font-weight="600" text-anchor="middle">Build prompt</text>
  <text class="sublabel" x="380" y="81" font-size="11" text-anchor="middle">RAUF.md + item + criteria</text>
  <rect class="box-primary" x="560" y="40" width="160" height="58" rx="8" stroke-width="1" />
  <text class="label" x="640" y="65" font-size="14" font-weight="600" text-anchor="middle">Spawn agent</text>
  <text class="sublabel" x="640" y="81" font-size="11" text-anchor="middle">Claude Code session</text>
  <rect class="box-primary" x="540" y="180" width="180" height="58" rx="8" stroke-width="1" />
  <text class="label" x="630" y="205" font-size="14" font-weight="600" text-anchor="middle">Parse signal</text>
  <text class="sublabel" x="630" y="221" font-size="11" text-anchor="middle">DONE · BLOCKED · NEEDS_HUMAN · REVIEW</text>
  <rect class="box-primary" x="300" y="180" width="160" height="58" rx="8" stroke-width="1" />
  <text class="label" x="380" y="205" font-size="14" font-weight="600" text-anchor="middle">Verify &amp; commit</text>
  <text class="sublabel" x="380" y="221" font-size="11" text-anchor="middle">runner commits [rauf] &lt;id&gt;</text>
  <rect class="box-primary" x="40" y="180" width="160" height="58" rx="8" stroke-width="1" />
  <text class="label" x="120" y="205" font-size="14" font-weight="600" text-anchor="middle">Advance</text>
  <text class="sublabel" x="120" y="221" font-size="11" text-anchor="middle">mark done → next item</text>
  <rect class="box-success" x="40" y="290" width="160" height="48" rx="8" stroke-width="1" />
  <text class="label" x="120" y="310" font-size="14" font-weight="600" text-anchor="middle">Complete</text>
  <text class="sublabel" x="120" y="326" font-size="11" text-anchor="middle">backlog empty</text>
  <rect class="box-warning" x="500" y="290" width="220" height="48" rx="8" stroke-width="1" />
  <text class="label" x="610" y="310" font-size="14" font-weight="600" text-anchor="middle">Loop pauses</text>
  <text class="sublabel" x="610" y="326" font-size="11" text-anchor="middle">Blocked · Needs Human · Limit</text>
  <polygon class="arrow-head" points="300,69 293.6,71.9 293.6,66.1" />
  <polyline class="arrow-line" points="200,69 293,69" />
  <polygon class="arrow-head" points="560,69 553.6,71.9 553.6,66.1" />
  <polyline class="arrow-line" points="460,69 553,69" />
  <polygon class="arrow-head" points="640,180 637.1,173.6 642.9,173.6" />
  <polyline class="arrow-line" points="640,98 640,173" />
  <text class="arrow-label" x="646" y="143" text-anchor="start">exits</text>
  <polygon class="arrow-head" points="460,209 466.4,206.1 466.4,211.9" />
  <polyline class="arrow-line" points="540,209 467,209" />
  <polygon class="arrow-head" points="200,209 206.4,206.1 206.4,211.9" />
  <polyline class="arrow-line" points="300,209 207,209" />
  <polygon class="arrow-head" points="120,98 122.9,104.4 117.1,104.4" />
  <polyline class="arrow-line" points="120,180 120,105" />
  <text class="arrow-label" x="126" y="143" text-anchor="start">next pending</text>
  <polygon class="arrow-head" points="120,290 117.1,283.6 122.9,283.6" />
  <polyline class="arrow-line" points="120,238 120,283" />
  <text class="arrow-label" x="126" y="266" text-anchor="start">empty</text>
  <polygon class="arrow-head" points="630,290 627.1,283.6 632.9,283.6" />
  <polyline class="arrow-line" points="630,238 630,283" />
  <text class="arrow-label" x="636" y="266" text-anchor="start">stop signal</text>
</svg>
