<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">

    <style>
      /* Dark mode (default — matches Starlight's default) */
      :root {
        --bg: hsl(224, 10%, 10%);
        --container-fill: hsl(224, 14%, 14%);
        --container-stroke: hsl(224, 10%, 25%);
        --primary-fill: hsl(217, 50%, 18%);
        --primary-stroke: #3b82f6;
        --secondary-fill: hsl(224, 14%, 16%);
        --secondary-stroke: hsl(224, 6%, 40%);
        --nested-fill: hsl(217, 50%, 14%);
        --nested-stroke: hsl(217, 40%, 30%);
        --info-fill: hsl(217, 50%, 18%);
        --info-stroke: #3b82f6;
        --success-fill: hsl(145, 38%, 16%);
        --success-stroke: #22c55e;
        --warning-fill: hsl(38, 48%, 18%);
        --warning-stroke: #f59e0b;
        --danger-fill: hsl(0, 45%, 18%);
        --danger-stroke: #ef4444;
        --neutral-fill: hsl(224, 14%, 16%);
        --neutral-stroke: hsl(224, 6%, 42%);
        --text: hsl(224, 6%, 82%);
        --text-muted: hsl(224, 6%, 56%);
        --arrow: hsl(224, 6%, 50%);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --container-fill: hsl(224, 20%, 97%);
          --container-stroke: hsl(224, 6%, 82%);
          --primary-fill: #dbeafe;
          --primary-stroke: #2563eb;
          --secondary-fill: hsl(224, 20%, 96%);
          --secondary-stroke: hsl(224, 7%, 60%);
          --nested-fill: hsl(217, 60%, 94%);
          --nested-stroke: hsl(217, 40%, 70%);
          --info-fill: #dbeafe;
          --info-stroke: #2563eb;
          --success-fill: #dcfce7;
          --success-stroke: #16a34a;
          --warning-fill: #fef3c7;
          --warning-stroke: #d97706;
          --danger-fill: #fee2e2;
          --danger-stroke: #dc2626;
          --neutral-fill: hsl(224, 20%, 96%);
          --neutral-stroke: hsl(224, 7%, 60%);
          --text: hsl(224, 10%, 20%);
          --text-muted: hsl(224, 7%, 40%);
          --arrow: hsl(224, 7%, 45%);
        }
      }

      .box-container { fill: var(--container-fill); stroke: var(--container-stroke); }
      .box-primary { fill: var(--primary-fill); stroke: var(--primary-stroke); }
      .box-secondary { fill: var(--secondary-fill); stroke: var(--secondary-stroke); }
      .box-nested { fill: var(--nested-fill); stroke: var(--nested-stroke); }
      .box-info { fill: var(--info-fill); stroke: var(--info-stroke); }
      .box-success { fill: var(--success-fill); stroke: var(--success-stroke); }
      .box-warning { fill: var(--warning-fill); stroke: var(--warning-stroke); }
      .box-danger { fill: var(--danger-fill); stroke: var(--danger-stroke); }
      .box-neutral { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
      .label { fill: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .sublabel { fill: var(--text-muted); font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .arrow-line { stroke: var(--arrow); fill: none; stroke-width: 1.5; }
      .arrow-line-dashed { stroke: var(--arrow); fill: none; stroke-width: 1.5; stroke-dasharray: 6,4; }
      .arrow-head { fill: var(--arrow); }
      .arrow-label { fill: var(--text-muted); font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 11px; }
    </style>
  <rect width="760" height="400" fill="var(--bg)" rx="4" />
  <rect class="box-neutral" x="70" y="30" width="280" height="46" rx="8" stroke-width="1" />
  <text class="label" x="210" y="58" font-size="14" font-weight="600" text-anchor="middle">rauf loop run &lt;path&gt;</text>
  <rect class="box-neutral" x="410" y="30" width="280" height="46" rx="8" stroke-width="1" />
  <text class="label" x="550" y="58" font-size="14" font-weight="600" text-anchor="middle">rauf loop run &lt;path&gt; --detached</text>
  <rect class="box-primary" x="100" y="110" width="220" height="64" rx="8" stroke-width="1" />
  <text class="label" x="210" y="138" font-size="14" font-weight="600" text-anchor="middle">In-process (foreground)</text>
  <text class="sublabel" x="210" y="154" font-size="11" text-anchor="middle">blocks terminal · unattended-safe</text>
  <rect class="box-secondary" x="440" y="102" width="220" height="40" rx="8" stroke-width="1" />
  <text class="label" x="550" y="118" font-size="14" font-weight="600" text-anchor="middle">Server daemon</text>
  <text class="sublabel" x="550" y="134" font-size="11" text-anchor="middle">auto-starts</text>
  <rect class="box-primary" x="440" y="162" width="220" height="52" rx="8" stroke-width="1" />
  <text class="label" x="550" y="184" font-size="14" font-weight="600" text-anchor="middle">Runner (server-owned)</text>
  <text class="sublabel" x="550" y="200" font-size="11" text-anchor="middle">returns immediately · loop stop</text>
  <rect class="box-info" x="120" y="256" width="520" height="56" rx="8" stroke-width="1" />
  <text class="label" x="380" y="280" font-size="14" font-weight="600" text-anchor="middle">Same files</text>
  <text class="sublabel" x="380" y="296" font-size="11" text-anchor="middle">events.ndjson · state.json · iteration-status.json · rauf.log</text>
  <rect class="box-container" x="120" y="340" width="520" height="50" rx="12" stroke-width="1" stroke-dasharray="4,3" />
  <text class="sublabel" x="140" y="360" font-size="11" font-weight="500">status · follow · log · web</text>
  <polygon class="arrow-head" points="210,110 207.1,103.6 212.9,103.6" />
  <polyline class="arrow-line" points="210,76 210,103" />
  <polygon class="arrow-head" points="550,102 547.1,95.6 552.9,95.6" />
  <polyline class="arrow-line" points="550,76 550,95" />
  <polygon class="arrow-head" points="550,162 547.1,155.6 552.9,155.6" />
  <polyline class="arrow-line" points="550,142 550,155" />
  <polygon class="arrow-head" points="300,256 293.4,253.8 297.2,249.6" />
  <polyline class="arrow-line" points="210,174 294.8,251.3" />
  <text class="arrow-label" x="249" y="215" text-anchor="end">writes</text>
  <polygon class="arrow-head" points="460,256 464.6,250.7 467,255.9" />
  <polyline class="arrow-line" points="550,214 466.3,253" />
  <text class="arrow-label" x="511" y="235" text-anchor="start">writes</text>
  <polygon class="arrow-head" points="380,340 377.1,333.6 382.9,333.6" />
  <polyline class="arrow-line" points="380,312 380,333" />
  <text class="arrow-label" x="388" y="326" text-anchor="start">read from files</text>
</svg>
